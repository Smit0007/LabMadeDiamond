services:

  mongodb:
    image: mongo:8

    container_name: diamond-mongodb

    restart: unless-stopped

    ports:
      - "${MONGO_PORT}:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - diamond-network

  backend:

    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: diamond-backend

    env_file:
      - .env

    ports:
      - "${BACKEND_PORT}:5000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    depends_on:
      - mongodb

    networks:
      - diamond-network

  frontend:

    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    container_name: diamond-frontend

    env_file:
      - ./frontend/.env

    ports:
      - "${FRONTEND_PORT}:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

    networks:
      - diamond-network

networks:
  diamond-network:

volumes:
  mongodb_data: